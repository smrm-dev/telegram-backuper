services:
  ui:
    build: .
    env_file: .env
    environment:
      UI_HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app_data:/data
      - ./sessions:/data/sessions

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongodb_data:
  app_data:
